[package]
name = "updater"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["runtime"]
runtime = [
    "dep:async-channel",
    "dep:base64",
    "dep:directories",
    "dep:ed25519-dalek",
    "dep:getrandom",
    "dep:gpui",
    "dep:gpui-component",
    "dep:reqwest",
    "dep:tracing",
    "dep:windows",
    "dep:windows-sys",
    "dep:zip",
]

[dependencies]
async-channel = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui-component = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["blocking"] }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Certificates", "Win32_Security_WinTrust"] }
windows-sys = { workspace = true, optional = true, features = ["Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
