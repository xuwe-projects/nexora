[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
readme = "../../README.md"
include = ["LINTS.md", "src/**", "templates/**"]
description = "Nexora 项目脚手架、工程检查与桌面应用发布命令行"
keywords = ["nexora", "cli", "desktop", "scaffold", "updater"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
askama = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
image = { workspace = true }
proc-macro2 = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true }
toml = { workspace = true, features = ["parse"] }
toml_edit = { workspace = true }
updater = { workspace = true }
url = { workspace = true }
zip = { workspace = true }

[[bin]]
name = "nexora"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
updater = { workspace = true, features = ["runtime"] }
