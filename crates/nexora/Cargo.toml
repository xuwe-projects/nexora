[package]
name = "nexora"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
include = [
    "examples/**",
    "src/**",
    "tests/**",
]
description = "以 GPUI、强类型路由和可组合业务模块构建 Rust 桌面全栈应用的框架"
keywords = ["nexora", "gpui", "desktop", "framework", "routing"]
categories = ["gui"]

[features]
default = ["desktop", "derive"]
derive = ["dep:contracts", "dep:macros"]
desktop = [
    "dep:actions",
    "dep:desktop",
    "dep:gpui",
    "dep:gpui-component",
    "dep:inventory",
    "dep:matchit",
    "dep:percent-encoding",
    "dep:pinyin",
    "dep:serde_html_form",
    "dep:serde_path_to_error",
    "dep:theme",
    "dep:tracing",
    "dep:ui",
    "dep:url",
    "dep:updater",
    "dep:oidc",
    "dep:reqwest",
    "dep:sha2",
    "dep:serde_json",
    "dep:toml",
]
server = [
    "dep:axum",
    "dep:account",
    "account/zitadel",
    "dep:migrate",
    "dep:rand",
    "dep:sha2",
    "dep:sqlx",
    "dep:tracing",
    "dep:url",
]

[dependencies]
account = { workspace = true, optional = true, default-features = false }
actions = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = ["form"] }
configuration = { workspace = true }
contracts = { workspace = true, optional = true }
desktop = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui-component = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
macros = { workspace = true, optional = true }
matchit = { workspace = true, optional = true }
migrate = { workspace = true, optional = true, default-features = false }
oidc = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
pinyin = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["blocking", "json"] }
serde = { workspace = true }
serde_html_form = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_path_to_error = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
theme = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
ui = { workspace = true, optional = true }
url = { workspace = true, optional = true }
updater = { workspace = true, optional = true, features = ["runtime"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = { workspace = true }
updater = { workspace = true, features = ["runtime"] }

[lib]
path = "src/lib.rs"

[[example]]
name = "desktop_basic"
path = "examples/desktop_basic.rs"
required-features = ["desktop", "derive"]

[[example]]
name = "server_basic"
path = "examples/server_basic.rs"
required-features = ["server"]
