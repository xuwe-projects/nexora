<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexora · 设置窗口原型</title>
  <link rel="stylesheet" href="../../foundation/palettes.css" />
  <link rel="stylesheet" href="../../foundation/titlebar.css" />
  <link rel="stylesheet" href="../../foundation/switcher.css" />
  <script src="../../foundation/switcher.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-family); font-size: var(--font-size-base); color: var(--foreground); }
    svg { display: block; }

    .window { width: 720px; height: 620px; display: flex; flex-direction: column;
      background: var(--background); border-radius: 10px; overflow: hidden; position: relative;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35); }
    /* 设置窗口场景：带底边框的实心标题栏，居中标题；两端放平台控制 */
    .titlebar { height: 40px; flex: none; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; position: relative; padding-left: 13px; background: var(--title-bar-bg); }
    .titlebar .tb-title { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 500; pointer-events: none; }
    .titlebar .traffic { z-index: 2; }
    .titlebar .winctl { height: 100%; margin-left: auto; z-index: 2; }
    .body { flex: 1; display: flex; min-height: 0; }

    .nav { width: 168px; flex: none; border-right: 1px solid var(--border); padding: 12px 10px; background: var(--group-box-bg); }
    .nav .item { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px; border-radius: var(--radius);
      font-size: 13px; color: var(--foreground); cursor: pointer; margin-bottom: 2px; }
    .nav .item svg { width: 15px; height: 15px; opacity: 0.8; }
    .nav .item:hover { background: var(--accent-bg); }
    .nav .item.active { background: var(--primary-bg); color: var(--primary-fg); font-weight: 500; }
    .nav .item.active svg { opacity: 1; }

    .panel { flex: 1; overflow-y: auto; padding: 22px 26px; }
    .panel h2 { font-size: 17px; font-weight: 600; }
    .panel .hint { margin-top: 4px; font-size: 12px; color: var(--muted-fg); margin-bottom: 18px; }

    .field { padding: 14px 0; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 20px; }
    .field:first-of-type { border-top: none; }
    .field .lbl { flex: 1; min-width: 0; }
    .field .lbl .t { font-size: 14px; font-weight: 500; }
    .field .lbl .d { font-size: 12px; color: var(--muted-fg); margin-top: 3px; line-height: 1.5; }
    .field .ctl { flex: none; }

    /* 分段选择（主题预设 / 颜色模式） */
    .segmented { display: inline-flex; padding: 3px; border-radius: var(--radius); background: var(--muted-bg); gap: 2px; }
    .segmented .seg { font-size: 13px; padding: 5px 12px; border-radius: 5px; cursor: pointer; color: var(--muted-fg); }
    .segmented .seg.active { background: var(--background); color: var(--foreground); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }

    /* 下拉 */
    .select { min-width: 150px; height: 34px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
      border-radius: var(--radius); border: 1px solid var(--input-border); background: var(--background); font-size: 13px; }
    .select svg { width: 14px; height: 14px; color: var(--muted-fg); }

    /* 开关 */
    .switch { width: 40px; height: 22px; border-radius: 20px; background: var(--primary-bg); position: relative; cursor: pointer; }
    .switch.off { background: var(--secondary-bg); }
    .switch i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .switch:not(.off) i { left: 20px; }

    /* 滑块（字号） */
    .slider { width: 180px; display: flex; align-items: center; gap: 10px; }
    .slider .track { flex: 1; height: 4px; border-radius: 4px; background: var(--secondary-bg); position: relative; }
    .slider .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 45%; border-radius: 4px; background: var(--primary-bg); }
    .slider .knob { position: absolute; left: 45%; top: 50%; transform: translate(-50%,-50%); width: 15px; height: 15px; border-radius: 50%; background: var(--primary-bg); border: 2px solid var(--background); box-shadow: 0 0 0 1px var(--primary-bg); }
    .slider .val { font-size: 13px; color: var(--muted-fg); width: 34px; }

    .footer { flex: none; border-top: 1px solid var(--border); padding: 12px 26px; display: flex; justify-content: flex-end; gap: 10px; }
    .btn { height: 34px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; }
    .btn.ghost { border-color: var(--border); background: transparent; color: var(--foreground); }
    .btn.ghost:hover { background: var(--accent-bg); }
    .btn.primary { background: var(--primary-bg); color: var(--primary-fg); }
    .btn.primary:hover { background: var(--primary-hover-bg); }
  </style>
</head>
<body class="proto-stage">
  <div class="window">
    <div class="titlebar">
      <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="tb-title">设置</div>
      <div class="winctl">
        <div class="wc" title="最小化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/></svg></div>
        <div class="wc" title="最大化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></div>
        <div class="wc close" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></div>
      </div>
    </div>
    <div class="body">
      <nav class="nav">
        <div class="item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
          外观
        </div>
        <div class="item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1 1 0 0 1 1.5 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
          账户与安全
        </div>
        <div class="item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          通知
        </div>
        <div class="item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="4"/></svg>
          高级
        </div>
      </nav>

      <div class="panel">
        <h2>外观</h2>
        <div class="hint">自定义界面主题、颜色模式与文字大小。</div>

        <div class="field">
          <div class="lbl">
            <div class="t">主题预设</div>
            <div class="d">选择应用的整体配色方案。</div>
          </div>
          <div class="ctl">
            <div class="segmented">
              <span class="seg active">Nexora</span>
              <span class="seg">石墨</span>
              <span class="seg">海洋</span>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="lbl">
            <div class="t">颜色模式</div>
            <div class="d">跟随系统，或固定浅色 / 深色。</div>
          </div>
          <div class="ctl">
            <div class="segmented">
              <span class="seg active">跟随系统</span>
              <span class="seg">浅色</span>
              <span class="seg">深色</span>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="lbl">
            <div class="t">基础字号</div>
            <div class="d">影响全局文字大小，范围 12–20px。</div>
          </div>
          <div class="ctl">
            <div class="slider">
              <div class="track"><div class="fill"></div><div class="knob"></div></div>
              <span class="val">14px</span>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="lbl">
            <div class="t">组件尺寸</div>
            <div class="d">控件的默认密度。</div>
          </div>
          <div class="ctl">
            <div class="select">标准 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></div>
          </div>
        </div>

        <div class="field">
          <div class="lbl">
            <div class="t">侧边栏自动折叠</div>
            <div class="d">窗口变窄时自动收起侧边栏。</div>
          </div>
          <div class="ctl"><div class="switch"><i></i></div></div>
        </div>

        <div class="field">
          <div class="lbl">
            <div class="t">减少动效</div>
            <div class="d">降低过渡与动画强度。</div>
          </div>
          <div class="ctl"><div class="switch off"><i></i></div></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="btn ghost">取消</div>
      <div class="btn primary">保存更改</div>
    </div>
  </div>
</body>
</html>
